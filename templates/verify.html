{% extends "base.html" %}
{% block title %}Подтверждение — Zenith{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 40px auto; padding: 32px; background: #2d1520; border: 2px solid #8b2035; border-radius: 16px;">
    <h1 style="color: #e8e8e8; font-family: 'Orbitron', sans-serif; text-align: center; margin-bottom: 24px;">
        <span class="material-symbols-outlined" style="vertical-align: middle; color: #a83250;">verified</span>
        Подтверждение аккаунта
    </h1>

    <p style="color: #c0c0c0; text-align: center; margin-bottom: 24px;">
        Введите 6-значный код из Telegram
    </p>

    <form method="POST" style="display: flex; flex-direction: column; gap: 16px;">
        <input type="text" name="code" placeholder="Код подтверждения" required maxlength="6"
               style="background: #1a0a0f; border: 1px solid #8b2035; border-radius: 8px; padding: 12px; color: #e8e8e8; font-size: 1.2rem; text-align: center; letter-spacing: 4px;">
        <button type="submit" style="background: #8b2035; color: #fff; border: none; padding: 12px; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 1rem;">
            Подтвердить
        </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <form action="/resend_code" method="POST" style="display: inline;">
            <button type="submit" style="background: transparent; border: 1px solid #8b2035; color: #a83250; padding: 8px 16px; border-radius: 50px; cursor: pointer; font-size: 0.9rem;">
                Отправить код снова
            </button>
        </form>
    </div>
</div>
{% endblock %}
